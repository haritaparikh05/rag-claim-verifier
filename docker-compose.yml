services:
  db:
    image: pgvector/pgvector:pg16
    container_name: claimverifier-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-claimverifier}
      POSTGRES_USER: ${DB_USER:-claimverifier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claimverifier}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claimverifier}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
